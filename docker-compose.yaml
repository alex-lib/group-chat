services:
  app:
    build: .
    ports:
      - "${CHAT_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/chat
      DB_USERNAME: chat
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CHAT_PASSWORD: ${CHAT_PASSWORD:?Set CHAT_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:19.0
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
