<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OnlineGroupChat</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://code.jquery.com/jquery-4.1.0.min.js"></script>
    <script src="/js/chat.js"></script>
</head>
<body>
    <section class="authentication">
        <h1>Group Chat</h1>
        <form id="loginForm">
            <h2>Join the chat</h2>
            <label for="loginName">Name</label>
            <input id="loginName" name="name" autocomplete="username" maxlength="32" required>
            <p>Choose a display name of 1–32 characters.</p>
            <label for="loginPassword">Chat password</label>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
            <p>Ask the chat owner for the shared password.</p>
            <button type="submit">Join chat</button>
        </form>
        <p id="authMessage" role="alert"></p>
    </section>
    <section class="session-controls">
        <button id="logoutButton" type="button">Sign out</button>
    </section>
    <p id="chatMessage" role="alert"></p>
    <section class="messages-and-users">
        <div class="messages-list">
        </div>
        <div class="users-list"></div>
    </section>
    <section class="controls">
        <form id="messageForm" role="form">
            <label for="messageInput" class="sr-only"></label>
            <textarea
                id="messageInput"
                name="message"
                class="new-message"
                placeholder="Type your message here..."
                rows="3"
                required></textarea>
            <button type="submit" class="send-message">Send</button>
        </form>
    </section>
</body>
</html>
